name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 契约测试（不需要浏览器）
        env:
          CXWORK_NO_AUTOINSTALL: "1"
        run: |
          python -m pip install --upgrade pip
          python -m unittest discover -s tests -v

      - name: 分发包能打出来
        run: python pack.py --version 0.0.0-ci
